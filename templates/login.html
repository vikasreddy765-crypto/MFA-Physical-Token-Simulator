<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFA Physical Token Simulator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🔐
            </div>

            <h1>MFA Token Simulator</h1>

            <p class="subtitle">
                Multi-Factor Authentication System
            </p>

            <form method="POST">

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    LOGIN
                </button>

            </form>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <div class="security-info">
                <span>🔒</span>
                <span>Password + Physical Token OTP</span>
            </div>

        </div>

    </div>

</body>
</html>
